version: "3.8"

services:
  backend:
    build: ./Backend
    container_name: weather-backend
    ports: 
      - "5000:5000"
    environment:
      PORT: 5000
      JWT_SECRET: strong_secret
      
      PGPASSWORD: <postgre Password>
      DATABASE_URL: postgres://postgres:<postgre Password>@host.docker.internal:5432/weather_app

      PGPORT: 5432
      USE_REDIS: "false"
      REDIS_URL: redis://redis:6379

    depends_on:
      - db
      - redis
  
  db:
    image: postgres:15
    container_name: weather_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weather_db

    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: weather-redis
    ports:
      - 6379:6379

    
volumes:
  pgdata: